general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.7
}

label {
    monitor =
    text = $TIME
    font_family = JetBrainsMono Nerd Font
    font_size = 72
    color = rgba(205, 214, 244, 1.0)
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    font_family = JetBrainsMono Nerd Font
    font_size = 20
    color = rgba(166, 173, 200, 0.9)
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.25

    outer_color = rgba(137, 180, 250, 0.9)
    inner_color = rgba(30, 30, 46, 0.85)
    font_color = rgba(205, 214, 244, 1.0)

    fade_on_empty = false
    placeholder_text = Password
    hide_input = false

    position = 0, -80
    halign = center
    valign = center
}
