[main]
# Шрифт (убедитесь, что он установлен в системе, например, JetBrains Mono Nerd Font)
font=JetBrainsMono Nerd Font:size=18
dpi-aware=no
prompt="> "
layer=overlay

# Размеры окна
width=40
lines=10
horizontal-pad=20
vertical-pad=20
inner-pad=10

# Скругление углов и рамка (работает на Wayland-композиторах вроде Hyprland, Sway)
image-icon-size=32
icon-theme=Papirus

[colors]
# Темная полупрозрачная тема (в формате RRGGBBAA)
background=1e1e2ee6        # Темный фон с легкой прозрачностью
text=cdd6f4ff             # Основной цвет текста (светлый)
match=f38ba8ff            # Цвет подсветки совпадений в поиске (акцентный)
selection=313244ff        # Фон выбранного элемента
selection-text=cdd6f4ff   # Текст выбранного элемента
border=89b4f4ff           # Цвет рамки

[border]
width=2
radius=12                 # Радиус скругления углов
